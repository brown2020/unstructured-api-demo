name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    # UNSTRUCTURED_API_KEY / UNSTRUCTURED_API_URL are optional for this gate.
    # Build and tests use UNSTRUCTURED_USE_FIXTURES=true so paid credits are not burned.
    # Never inline UNSTRUCTURED_* or NEXT_PUBLIC_* here — if a future smoke job needs
    # secrets, inject only via ${{ secrets.* }} on that job (not this gate), and keep
    # deferred client init in src/lib/unstructured-client.ts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          UNSTRUCTURED_USE_FIXTURES: "true"
      - run: npm run build
        env:
          UNSTRUCTURED_USE_FIXTURES: "true"
